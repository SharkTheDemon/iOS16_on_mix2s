name: shim

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shim/**"
      - ".github/workflows/shim.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc

      - name: Build Shim
        working-directory: shim
        run: |
          set -e
          CC=aarch64-linux-gnu-gcc
          OBJCOPY=aarch64-linux-gnu-objcopy
          CFLAGS="-O2 -ffreestanding -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra"
          mkdir -p out
          for f in start.S shim.c console.c mmu.c fdt.c loader.c ufs.c; do
              $CC $CFLAGS -c $f -o out/${f%.*}.o
          done
          aarch64-linux-gnu-readelf -r out/*.o | grep -c ABS64 || true
          $CC $CFLAGS -static -T shim.ld -Wl,--build-id=none -Wl,--no-warn-rwx-segments -Wl,-N \
              out/start.o out/shim.o out/console.o out/mmu.o out/fdt.o out/loader.o out/ufs.o -o out/shim.elf
          $OBJCOPY -O binary out/shim.elf out/Image
          size=$(aarch64-linux-gnu-nm out/shim.elf | awk '$3=="_end"{print $1}')
          size=$((16#${size:-0}))
          truncate -s "$size" out/Image
          ls -la out/Image

      - uses: actions/upload-artifact@v4
        with:
          name: shim-image
          path: shim/out/Image
