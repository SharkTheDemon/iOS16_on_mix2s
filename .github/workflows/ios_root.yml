name: build-ios-root

on:
  workflow_dispatch:

concurrency:
  group: ios-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iPhone X iOS 16.7.16 IPSW
        run: |
          IPSW_URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77002/0281BFC6-38ED-485A-A8BE-8871861174B1/iPhone_4.7_P3_16.7.16_20H392_Restore.ipsw"
          echo "Downloading IPSW from Apple CDN..."
          curl -fSL -o ipsw.zip "$IPSW_URL"
          ls -lh ipsw.zip

      - name: Extract required DMGs from IPSW
        run: |
          echo "Extracting DMGs..."
          unzip -p ipsw.zip 087-86684-044.dmg > OS.dmg
          unzip -p ipsw.zip 087-86580-047.dmg > SYSTEMOS.dmg
          unzip -p ipsw.zip 087-86715-047.dmg > APPOS.dmg
          rm ipsw.zip
          ls -lh *.dmg

      - name: Build HFS+ Root Volume
        run: |
          chmod +x tools/mkiosroot-macos.sh
          ./tools/mkiosroot-macos.sh ios16-root.raw OS.dmg SYSTEMOS.dmg APPOS.dmg
          ls -lh ios16-root.raw

      - name: Convert to Android Sparse Image
        run: |
          python3 tools/img2simg.py ios16-root.raw ios16-root.simg
          ls -lh ios16-root.simg
          rm -f ios16-root.raw *.dmg

      - name: Compress Sparse Image
        run: |
          zip -9 -v ios16-root.simg.zip ios16-root.simg

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-sparse
          path: ios16-root.simg.zip
          retention-days: 14
