name: build-sweet-root-test

on:
  push:
    paths:
      - '.github/workflows/sweet_root_test.yml'
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build 32MB HFS+ Root on macOS using Apple newfs_hfs
        run: |
          mkdir -p /tmp/init-bin
          base64 -D < tools/sweet-init.b64 > /tmp/init-bin/launchd
          chmod 755 /tmp/init-bin/launchd
          chmod +x tools/mkhfsroot.sh
          ./tools/mkhfsroot.sh sweet-root.raw 32 /tmp/init-bin/launchd
          ls -lh sweet-root.raw

      - name: Convert to Android Sparse Image
        run: |
          python3 tools/img2simg.py sweet-root.raw sweet-root.simg
          ls -lh sweet-root.simg

      - name: Zip Sparse Image
        run: |
          zip sweet-root.simg.zip sweet-root.simg
          ls -lh sweet-root.simg.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-root-sparse-macos
          path: sweet-root.simg.zip
          retention-days: 7
